limit_req_zone $binary_remote_addr zone=finance_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 188.120.234.176;

    location / {
        return 301 https://188.120.234.176$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 188.120.234.176;

    # FirstVDS/ISPmanager manages this publicly trusted IP certificate.
    ssl_certificate /usr/local/mgr5/etc/manager.crt;
    ssl_certificate_key /usr/local/mgr5/etc/manager.key;

    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api/auth/ {
        limit_req zone=finance_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
